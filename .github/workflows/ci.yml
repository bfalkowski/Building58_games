name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Every line of every tracked file, so a key that got past the hook still fails.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node .githooks/check-secrets.cjs --all

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no secrets in what the pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node .githooks/check-secrets.cjs --diff "$BASE" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
